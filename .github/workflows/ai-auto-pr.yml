name: Auto PR & Merge

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_ACTIONS }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BRANCH="${{ github.ref_name }}"
          BASE="refactor/multi-provider"

          # Check if an open PR already exists for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number' || echo "")

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists, merging..."
            PR_NUM="$EXISTING"
          else
            echo "Creating PR: $COMMIT_MSG"
            PR_URL=$(gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "$COMMIT_MSG" \
              --body "Automated PR from \`$BRANCH\`

          **Commit:** $COMMIT_MSG
          **By:** ${{ github.actor }}")

            PR_NUM=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
            echo "Created PR #$PR_NUM"
          fi

          echo "Merging PR #$PR_NUM..."
          gh pr merge "$PR_NUM" --merge --admin
          echo "Done!"
