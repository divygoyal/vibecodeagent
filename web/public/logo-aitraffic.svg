<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <linearGradient id="claw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Stylized claw with trend line -->
  <g transform="translate(2, 2)">
    <!-- Background circle -->
    <rect width="36" height="36" rx="10" fill="url(#icon-grad)"/>
    
    <!-- Claw marks (3 diagonal slashes) -->
    <path d="M10 26 L16 10" stroke="rgba(0,0,0,0.6)" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 26 L22 10" stroke="rgba(0,0,0,0.6)" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 26 L28 10" stroke="rgba(0,0,0,0.6)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Upward trend line overlay -->
    <path d="M8 28 L14 22 L20 24 L28 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="28" cy="12" r="2" fill="white"/>
  </g>
  
  <!-- Text: AItraffic -->
  <text x="46" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">
    <tspan fill="white">AI</tspan><tspan fill="url(#claw-grad)">traffic</tspan>
  </text>
</svg>
